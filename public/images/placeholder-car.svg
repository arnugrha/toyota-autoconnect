<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EB0A1E"/>
      <stop offset="100%" stop-color="#ff4d5e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#EB0A1E" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Studio Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <circle cx="400" cy="230" r="320" fill="url(#glow)"/>

  <!-- Studio Floor reflection grid -->
  <line x1="100" y1="410" x2="700" y2="410" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>
  <ellipse cx="400" cy="412" rx="280" ry="14" fill="#000000" fill-opacity="0.6" filter="blur(6px)"/>

  <!-- Vehicle Silhouette (Modern Sleek Car) -->
  <g transform="translate(100, 160)">
    <!-- Cabin Glass -->
    <path d="M140 130 L 220 50 L 390 50 L 460 130 Z" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <path d="M 235 60 L 305 60 L 305 125 L 165 125 Z" fill="#1e293b" fill-opacity="0.8"/>
    <path d="M 320 60 L 380 60 L 440 125 L 320 125 Z" fill="#1e293b" fill-opacity="0.8"/>

    <!-- Car Body -->
    <path d="M 40 170 
             C 45 150, 70 140, 110 135 
             L 150 130 
             L 230 45 
             C 240 40, 260 40, 380 40 
             L 460 125 
             L 530 135 
             C 560 140, 580 155, 570 175 
             L 560 200 
             C 540 205, 520 205, 500 205 
             C 495 180, 460 160, 430 160 
             C 400 160, 365 180, 360 205 
             L 240 205 
             C 235 180, 200 160, 170 160 
             C 140 160, 105 180, 100 205 
             L 50 205 
             Z" fill="url(#carBody)" stroke="#94a3b8" stroke-width="2"/>

    <!-- Red accent character line -->
    <path d="M 120 145 Q 320 140 540 150" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round"/>

    <!-- Wheels -->
    <g transform="translate(170, 205)">
      <circle cx="0" cy="0" r="42" fill="#090d16" stroke="#475569" stroke-width="5"/>
      <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="#cbd5e1" stroke-width="3"/>
      <circle cx="0" cy="0" r="10" fill="#EB0A1E"/>
      <!-- Spokes -->
      <line x1="0" y1="-26" x2="0" y2="26" stroke="#94a3b8" stroke-width="3"/>
      <line x1="-26" y1="0" x2="26" y2="0" stroke="#94a3b8" stroke-width="3"/>
      <line x1="-18" y1="-18" x2="18" y2="18" stroke="#94a3b8" stroke-width="2.5"/>
      <line x1="18" y1="-18" x2="-18" y2="18" stroke="#94a3b8" stroke-width="2.5"/>
    </g>

    <g transform="translate(430, 205)">
      <circle cx="0" cy="0" r="42" fill="#090d16" stroke="#475569" stroke-width="5"/>
      <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="#cbd5e1" stroke-width="3"/>
      <circle cx="0" cy="0" r="10" fill="#EB0A1E"/>
      <!-- Spokes -->
      <line x1="0" y1="-26" x2="0" y2="26" stroke="#94a3b8" stroke-width="3"/>
      <line x1="-26" y1="0" x2="26" y2="0" stroke="#94a3b8" stroke-width="3"/>
      <line x1="-18" y1="-18" x2="18" y2="18" stroke="#94a3b8" stroke-width="2.5"/>
      <line x1="18" y1="-18" x2="-18" y2="18" stroke="#94a3b8" stroke-width="2.5"/>
    </g>

    <!-- Headlight & Taillight glow -->
    <path d="M 555 160 L 575 168 L 565 178 Z" fill="#38bdf8" filter="drop-shadow(0 0 8px #38bdf8)"/>
    <path d="M 45 160 L 35 168 L 45 174 Z" fill="#ef4444" filter="drop-shadow(0 0 6px #ef4444)"/>
  </g>

  <!-- Toyota AutoConnect Watermark/Badge -->
  <text x="400" y="455" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="3" fill="#64748b" fill-opacity="0.8">TOYOTA AUTOCONNECT • SHOWROOM</text>
</svg>
